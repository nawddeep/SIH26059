# Phase E: Uncertainty Quantification and Navigational Risk Configuration
experiment:
  name: "phase_e_uncertainty_and_risk"
  description: "Phase E configuration for expanding lead-time uncertainty and IMO POLARIS risk functions"
  is_smoke_test: true

uncertainty:
  method: "linear"           # Options: 'linear', 'exponential', 'polynomial'
  horizons: [1, 3, 5, 7]
  quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]
  output_filename_prefix: "SMOKE_TEST_ONLY_"

polaris_risk:
  open_water_threshold: 0.15 # SIC threshold below which ice navigation risk is negligible
  open_water_risk: 0.0       # Residual risk in ice-free water
  max_risk: 1.0              # Maximum risk approaching solid pack ice (SIC=1.0)
  default_polar_class: "PC4" # Reference expedition vessel class (pending NCPOR confirmation)
  class_exponents:
    PC1: 2.8                 # Year-round operations in all polar waters
    PC2: 2.4                 # Moderate multi-year ice conditions
    PC3: 2.0                 # Second-year ice with multi-year inclusions
    PC4: 1.7                 # Thick first-year ice
    PC5: 1.4                 # Medium first-year ice
    PC6: 1.1                 # Summer/autumn in medium first-year ice
    PC7: 0.8                 # Summer/autumn in thin first-year ice
    UNCLASSED: 0.5           # Non-ice-strengthened vessel

output:
  dir: "output/phase_e"
  plots_dir: "output/phase_e/plots"
  uncertainty_demo_png: "output/phase_e/phase_e_uncertainty_demo.png"
  uncertainty_demo_pdf: "output/phase_e/phase_e_uncertainty_demo.pdf"
  risk_demo_png: "output/phase_e/phase_e_risk_vs_sic.png"
  risk_demo_pdf: "output/phase_e/phase_e_risk_vs_sic.pdf"
  risk_table_json: "output/phase_e/phase_e_risk_table.json"
