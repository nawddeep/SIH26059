# Sea-Ice Concentration Forecasting Model - Phase 1 Configuration
# Version: sic_unet_v001

# Model metadata
model:
  name: "sic_unet_v001"
  version: "0.1.0"
  phase: 1
  description: "SIC-only baseline with U-Net, 7-day history -> 1-day ahead forecast"

# Data sources
data:
  # NOAA/NSIDC Sea Ice Concentration CDR v6 (G02202)
  nsidc:
    dataset: "G02202"
    hemisphere: "south"  # Antarctic
    grid: "ps25"  # 25km polar stereographic
    version: 6
    base_url: "https://noaadata.apps.nsidc.org/NOAA/G02202_V6/south/daily"

  # Date ranges — full circumpolar record (2008-2018).
  # Chronological split: no shuffling across time, so val/test are strictly
  # future relative to train (prevents temporal leakage).
  #   train 8 yrs | val 1 yr | test 2 yrs
  date_ranges:
    train_start: "2008-01-01"
    train_end: "2015-12-31"
    val_start: "2016-01-01"
    val_end: "2016-12-31"
    test_start: "2017-01-01"
    test_end: "2018-12-31"

  # Data paths (actual on-disk layout: note the doubled data/data/ prefix
  # for raw sources, written by the download scripts)
  paths:
    raw: "data/data/sic"                  # NSIDC SIC:  data/data/sic/{YYYY}/*.nc
    raw_era5: "data/data/raw/era5"        # ERA5:       data/data/raw/era5/{YYYY}/*.nc
    raw_currents: "data/data"             # GLORYS:     data/data/{YYYY}/currents_GLORYS12_*.nc
    processed: "data/processed"
    daily: "data/processed/regridded/daily"
    mask: "data/processed/land_ocean_mask_ps25.npy"

# Model architecture
architecture:
  type: "unet"
  input_shape: [7, 332, 316]  # [timesteps, height, width] - Antarctic grid (y=332, x=316)
  output_shape: [1, 332, 316]  # Single next-day forecast

  # U-Net specifications
  encoder_channels: [7, 32, 64, 128, 256]  # Input channels, then encoder stages
  decoder_channels: [256, 128, 64, 32, 1]  # Decoder stages to output
  use_batch_norm: true
  use_skip_connections: true
  activation: "relu"
  output_activation: "sigmoid"  # Bounded [0,1] for SIC

# Forecasting parameters
forecast:
  input_window: 7  # Days of history
  forecast_horizon: 1  # Days ahead (next-day only in Phase 1)
  stride: 1  # Sliding window stride

# Training hyperparameters
training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.001
  optimizer: "adam"
  loss_function: "masked_mae"  # Land pixels excluded

  # Early stopping
  early_stopping:
    patience: 15
    min_delta: 0.0001
    monitor: "val_loss"

  # Learning rate scheduling
  lr_scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 5
    min_lr: 0.00001

  # Checkpointing
  checkpoint:
    save_best: true
    save_last: true
    monitor: "val_loss"
    mode: "min"

# Data preprocessing
preprocessing:
  # SIC normalization (already 0-100 in source)
  sic:
    scale: 0.01  # Convert percentage to [0,1]
    fill_missing: 0.0  # Fill missing with 0 (no ice)

  # Land-ocean mask
  mask:
    land_value: 0
    ocean_value: 1
    missing_value: -1

# Evaluation metrics
evaluation:
  metrics:
    - "mae"  # Mean Absolute Error
    - "rmse"  # Root Mean Squared Error
    - "spatial_correlation"  # Spatial correlation coefficient
    - "ice_edge_displacement"  # Ice edge accuracy

  # Ice edge definition
  ice_edge:
    threshold: 0.15  # 15% concentration threshold

  # Regional breakdown (optional for Phase 1)
  regions:
    - "weddell"
    - "ross"
    - "amundsen_bellingshausen"
    - "indian"
    - "pacific"

# Baseline models
baselines:
  persistence:
    description: "SIC_hat(t+1) = SIC(t)"

  climatology:
    description: "Day-of-year expected SIC from training period"
    smoothing_window: 15  # Days for climatology smoothing

# Output configuration
output:
  model_dir: "checkpoints"
  results_dir: "output"
  plots_dir: "output/plots"
  logs_dir: "output/logs"

  # Result formats
  formats:
    predictions: "netcdf"
    metrics: "json"
    plots: "png"

# Computational resources
compute:
  device: "mps"  # Apple Silicon GPU
  num_workers: 0
  pin_memory: false
  mixed_precision: false

# Random seed for reproducibility
seed: 42
